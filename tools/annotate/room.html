<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Annotate a room</title>
<style>
 body{background:#15151b;color:#e8e8ee;font:14px/1.5 system-ui,sans-serif;margin:0;padding:12px}
 h1{font-size:15px;margin:0 0 6px;font-weight:600}
 #wrap{position:relative;overflow-x:auto;overflow-y:hidden;border-radius:6px;background:#000;
       border:1px solid #333}
 #stage{position:relative;line-height:0}
 img{display:block}
 canvas{position:absolute;top:0;left:0;cursor:crosshair}
 .row{display:flex;gap:14px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
 .panel{width:290px}
 ul{list-style:none;padding:0;margin:6px 0;max-height:300px;overflow:auto}
 li{padding:4px 7px;border-radius:4px;cursor:pointer;font-size:12.5px;display:flex;
    justify-content:space-between;gap:6px}
 li:hover{background:#2a2a35}
 li.on{background:#4a6ea8}
 li.done span.c{color:#9fd39f}
 span.c{color:#7a7a8e;font:11px ui-monospace,monospace}
 button{background:#33333f;color:#e8e8ee;border:1px solid #4d4d60;border-radius:5px;
        padding:6px 10px;font:inherit;cursor:pointer;margin:0 5px 5px 0}
 button.primary{background:#4a6ea8;border-color:#5b83c4}
 button.on{background:#8a5a2a;border-color:#b07a3a}
 textarea{width:100%;height:150px;background:#0e0e14;color:#9fd39f;border:1px solid #33333f;
          border-radius:5px;padding:7px;font:11px/1.4 ui-monospace,monospace}
 select{background:#22222b;color:#e8e8ee;border:1px solid #4d4d60;border-radius:5px;padding:5px}
 .hint{color:#9a9aae;font-size:12.5px;margin:4px 0}
 b{color:#ffd9a0}
 .warn{color:#ffb0b0}
</style></head><body>
<h1 id="title">Annotate a room</h1>
<p class="hint" id="lede">Loading&hellip;</p>
<div id="wrap"><div id="stage">
  <img id="plate" alt="">
  <canvas id="c"></canvas>
</div></div>
<div class="row">
  <div class="panel">
    <div class="hint">Room: <select id="pick"></select></div>
    <button id="mWalk" class="primary">Walk box</button>
    <button id="close">Close shape</button>
    <button id="mDepth">Depth samples</button>
    <button id="mSpawn">Arrival point</button>
    <button id="mProof">Occlusion proof point</button>
    <div class="hint" id="mode">Mode: walk box</div>
    <button id="undo">Undo last</button>
    <button id="reset">Reset all</button>
  </div>
  <div class="panel">
    <div class="hint">Hotspots &amp; exits &mdash; pick one, then drag its box:</div>
    <ul id="list"></ul>
  </div>
  <div class="panel">
    <div class="hint">Which plane masks an actor in each band
      &mdash; <b>0 means masked by nothing</b>:</div>
    <ul id="planes"></ul>
    <div class="hint" id="planeHint"></div>
  </div>
  <div class="panel">
    <button class="primary" id="gen">Generate</button>
    <button id="copy">Copy</button>
    <textarea id="out" readonly placeholder="Annotate, then press Generate."></textarea>
  </div>
</div>
<script>
/*
 * THE ROOM IS AN ARGUMENT NOW, NOT A LITERAL. Doc 36 Q15.
 *
 * This page was Room 2 throughout: the title, the plate src, the note about a
 * 3700-wide street, and an ITEMS array of fifteen hotspot and exit records
 * written into the source. Doc 46 part four puts Tyler in the annotator for
 * fifteen minutes per room -- and for any room but the second there was no
 * annotator to be in, while every rect, the walk box, both depth samples and
 * the arrival point come from here.
 *
 * WHAT IT READS, AND WHY FROM CONTENT. The room list, the plate path and the
 * hotspot roster come from `content/manifest.json` and the room's own file,
 * which vite serves in dev and copies into the build -- so the page works
 * identically from a checkout and from the Pages site, which is where Tyler
 * opens it. `reference/` is NOT copied into the build, so an existing
 * annotation cannot be read here; the seed comes from the compiled room
 * instead, which is the same geometry one step downstream.
 *
 * IT EMITS ONLY WHAT IT DRAWS. The old version emitted a whole annotation
 * object, so pasting it over `reference/room-02/annotation.json` would have
 * dropped that file's obstacles, lamps, act states and half a dozen notes.
 * What comes out now is the geometry keys and nothing else, to be merged.
 */
const params = new URLSearchParams(location.search);
const S = { walk: [], closed: false, depth: [], spawn: null, rects: {}, planes: {}, proofs: [] };
let ITEMS = [], BANDS = [], room = null, mode = 'walk', current = null, drag = null;
const img = document.getElementById('plate'), cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 0, H = 0;

const base = '../../';
const j = (path) => fetch(base + path).then((r) => {
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
});

async function boot() {
  const manifest = await j('content/manifest.json');
  const rooms = [];
  for (const path of manifest.rooms) {
    try { rooms.push({ path, data: await j(path) }); } catch (e) { /* not served */ }
  }
  // Rooms with a plate to draw on. A room with no background has no picture to
  // read geometry off, which is what this page is for.
  const drawable = rooms.filter((r) => r.data.background);
  const pick = document.getElementById('pick');
  const asked = params.get('room');
  for (const r of drawable) {
    const o = document.createElement('option');
    o.value = r.data.id; o.textContent = r.data.id + ' — ' + (r.data.name || '');
    pick.appendChild(o);
  }
  const chosen = drawable.find((r) => r.data.id === asked
    || String(r.data.roomNumber) === asked) || drawable[0];
  if (!chosen) { document.getElementById('lede').textContent = 'No room has a plate.'; return; }
  pick.value = chosen.data.id;
  pick.onchange = () => { location.search = '?room=' + pick.value; };
  load(chosen.data);
}

function load(data) {
  room = data;
  document.getElementById('title').textContent = 'Annotate ' + data.id
    + (data.name ? ' — ' + data.name : '');
  ITEMS = [
    ...(data.hotspots || []).map((h) => ({ id: h.id, name: h.name, kind: 'hotspot' })),
    ...(data.exits || []).map((e) => ({ id: e.id, name: e.name, kind: 'exit', to: e.to })),
  ];
  // SEEDED FROM THE COMPILED ROOM, so re-annotating shows what is there rather
  // than a blank plate. Every value stays editable: the point is to correct a
  // reading, not to start one from nothing every time.
  for (const it of ITEMS) {
    const found = [...(data.hotspots || []), ...(data.exits || [])].find((x) => x.id === it.id);
    const rect = found && (found.rect || (found.states || []).map((s) => s.rect).find(Boolean));
    if (rect) S.rects[it.id] = rect.slice();
  }
  if (data.walkableOutline) { S.walk = data.walkableOutline.map((p) => p.slice()); S.closed = true; }
  const curve = (data.walkBoxes || []).map((b) => b.scaleMode)
    .find((m) => m && m.kind === 'curve');
  if (curve) S.depth = [[Math.round((data.size ? data.size[0] : 1920) / 2), curve.farY, curve.farHeight],
    [Math.round((data.size ? data.size[0] : 1920) / 2), curve.nearY, curve.nearHeight]];
  const entrance = (data.entrances || []).find((e) => e.from === 'default');
  if (entrance) S.spawn = entrance.at.slice();

  // THE BANDS THE COMPILER WILL ASK ABOUT. Taken from the room's existing walk
  // boxes with any carved suffix removed -- a band split around an obstacle is
  // still one depth and one decision. A room never compiled has none yet, and
  // the compiler's refusal names them the first time it runs, which is the
  // honest order: it knows how it will cut the floor and this page does not.
  BANDS = [...new Set((data.walkBoxes || []).map((b) => b.id)
    .map((id) => (/^(mud_(?:far|mid|near)|boardwalk)/.exec(id) || [id])[0]))];
  for (const band of BANDS) {
    const box = (data.walkBoxes || []).find((b) => b.id === band || b.id.indexOf(band + '_') === 0);
    S.planes[band] = box ? box.clipPlane : 0;
  }
  S.proofs = (data.occlusionProofs || []).map((p) => ({ at: p.at.slice(), expect: p.expect,
    box: p.box, note: p.note }));
  document.getElementById('planeHint').innerHTML = BANDS.length
    ? 'Levels must be ones this room’s <code>occlusionPlanes</code> declares.'
    : '<span class="warn">This room has never been compiled, so its bands are not known yet. '
      + 'Run <code>node tools/compile-room.mjs N</code> once: it refuses and names every band '
      + 'it needs.</span>';

  document.getElementById('lede').innerHTML = 'The plate is <b>' + (data.size
    ? data.size.join('×') : 'its own size') + '</b>. Everything exports in the plate’s '
    + 'own pixel space. <b>Walk box</b>: click corners, then Close. <b>Depth</b>: click at the '
    + 'FAR end where he stands, then the NEAR end. <b>Rects</b>: pick from the list, then drag. '
    + '<b>Occlusion proof point</b>: click where an actor should be masked, then give the plane.';
  img.src = base + data.background;
  renderList(); renderPlanes();
}

img.onload = () => { W = img.naturalWidth; H = img.naturalHeight; cv.width = W; cv.height = H;
  document.getElementById('wrap').style.height = (H + 2) + 'px'; draw(); };

function pt(e) { const r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * (W / r.width)),
    Math.round((e.clientY - r.top) * (H / r.height))]; }

function draw() {
  cx.clearRect(0, 0, W, H);
  if (S.walk.length) {
    cx.beginPath(); cx.moveTo(S.walk[0][0], S.walk[0][1]);
    S.walk.slice(1).forEach((p) => cx.lineTo(p[0], p[1]));
    if (S.closed) cx.closePath();
    cx.strokeStyle = '#6fd36f'; cx.lineWidth = 3; cx.stroke();
    if (S.closed) { cx.fillStyle = 'rgba(111,211,111,.14)'; cx.fill(); }
    S.walk.forEach((p) => { cx.fillStyle = '#6fd36f'; cx.fillRect(p[0] - 4, p[1] - 4, 8, 8); });
  }
  S.depth.forEach((p, i) => { cx.strokeStyle = '#ffd9a0'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(p[0], p[1]); cx.lineTo(p[0], p[1] - p[2]); cx.stroke();
    cx.fillStyle = '#ffd9a0'; cx.font = '16px system-ui';
    cx.fillText((i ? 'near ' : 'far ') + p[2] + 'px', p[0] + 8, p[1] - p[2] / 2); });
  if (S.spawn) { cx.strokeStyle = '#7fd0ff'; cx.lineWidth = 3; cx.beginPath();
    cx.arc(S.spawn[0], S.spawn[1], 11, 0, 7); cx.stroke();
    cx.beginPath(); cx.moveTo(S.spawn[0] - 16, S.spawn[1]);
    cx.lineTo(S.spawn[0] + 16, S.spawn[1]); cx.stroke(); }
  // A PROOF POINT IS DRAWN AS THE FIGURE THAT WILL STAND THERE, not as a dot.
  // The question it answers is whether a MAN is behind something, and a dot on
  // the floor cannot be looked at and judged.
  S.proofs.forEach((p) => {
    const height = figureAt(p.at[1]);
    cx.strokeStyle = '#ff9de2'; cx.lineWidth = 3;
    cx.strokeRect(p.at[0] - height * 0.1775, p.at[1] - height, height * 0.355, height);
    cx.fillStyle = '#ff9de2'; cx.font = '15px system-ui';
    cx.fillText('plane ' + p.expect, p.at[0] + 8, p.at[1] - height - 6);
  });
  for (const [id, r] of Object.entries(S.rects)) {
    const it = ITEMS.find((i) => i.id === id); const ex = it && it.kind === 'exit';
    cx.strokeStyle = ex ? '#ff9de2' : '#ffd166'; cx.lineWidth = 3;
    cx.strokeRect(r[0], r[1], r[2], r[3]);
    cx.fillStyle = ex ? '#ff9de2' : '#ffd166'; cx.font = '15px system-ui';
    cx.fillText(id, r[0] + 4, r[1] - 5);
  }
  if (drag) { cx.strokeStyle = '#fff'; cx.setLineDash([7, 5]); cx.lineWidth = 2;
    cx.strokeRect(drag.x, drag.y, drag.w, drag.h); cx.setLineDash([]); }
}

/** The drawn figure height at a row, from the two depth samples. */
function figureAt(y) {
  const far = S.depth[0], near = S.depth[1];
  if (!far || !near || near[1] === far[1]) return 200;
  const t = Math.max(0, Math.min(1, (y - far[1]) / (near[1] - far[1])));
  return Math.round(far[2] + (near[2] - far[2]) * t);
}

cv.addEventListener('mousedown', (e) => {
  const p = pt(e);
  if (mode === 'rect' && current) { drag = { x: p[0], y: p[1], w: 0, h: 0, sx: p[0], sy: p[1] }; return; }
  if (mode === 'walk') { if (!S.closed) S.walk.push(p); }
  else if (mode === 'depth') {
    if (S.depth.length >= 2) S.depth = [];
    const h = prompt('Figure height in plate pixels at this point?', S.depth.length ? '250' : '190');
    if (h) S.depth.push([p[0], p[1], parseInt(h, 10)]);
    S.depth.sort((a, b) => a[1] - b[1]);
  } else if (mode === 'spawn') { S.spawn = p; }
  else if (mode === 'proof') {
    const level = prompt('Which plane should mask an actor standing here?\n'
      + 'A level this room’s occlusionPlanes declares.', '1');
    if (level !== null) {
      const note = prompt('Why here? This is the only thing that helps whoever reads a '
        + 'failure decide whether the game is wrong or the point is.', '') || '';
      S.proofs.push({ at: p, expect: parseInt(level, 10), note });
    }
  }
  draw();
});
cv.addEventListener('mousemove', (e) => { if (!drag) return; const p = pt(e);
  drag.x = Math.min(p[0], drag.sx); drag.y = Math.min(p[1], drag.sy);
  drag.w = Math.abs(p[0] - drag.sx); drag.h = Math.abs(p[1] - drag.sy); draw(); });
cv.addEventListener('mouseup', () => { if (drag && current && drag.w > 4 && drag.h > 4) {
    S.rects[current] = [drag.x, drag.y, drag.w, drag.h]; renderList(); }
  drag = null; draw(); });

function setMode(m) { mode = m; current = null; renderList();
  document.getElementById('mode').textContent = 'Mode: '
    + ({ walk: 'walk box', depth: 'depth samples', spawn: 'arrival point',
      proof: 'occlusion proof point', rect: 'drag a box' })[m];
  ['mWalk', 'mDepth', 'mSpawn', 'mProof'].forEach((id) =>
    document.getElementById(id).classList.remove('on'));
  const b = { walk: 'mWalk', depth: 'mDepth', spawn: 'mSpawn', proof: 'mProof' }[m];
  if (b) document.getElementById(b).classList.add('on');
}
document.getElementById('mWalk').onclick = () => setMode('walk');
document.getElementById('mDepth').onclick = () => setMode('depth');
document.getElementById('mSpawn').onclick = () => setMode('spawn');
document.getElementById('mProof').onclick = () => setMode('proof');
document.getElementById('close').onclick = () => { S.closed = true; draw(); };
document.getElementById('undo').onclick = () => {
  if (mode === 'walk') { S.walk.pop(); S.closed = false; }
  else if (mode === 'depth') S.depth.pop();
  else if (mode === 'proof') S.proofs.pop();
  else if (current) delete S.rects[current];
  renderList(); draw(); };
document.getElementById('reset').onclick = () => { if (!confirm('Clear everything?')) return;
  S.walk = []; S.closed = false; S.depth = []; S.spawn = null; S.rects = {}; S.proofs = [];
  renderList(); draw(); };

function renderList() {
  const ul = document.getElementById('list'); ul.innerHTML = '';
  ITEMS.forEach((it) => {
    const li = document.createElement('li');
    const done = !!S.rects[it.id];
    li.className = (current === it.id ? 'on ' : '') + (done ? 'done' : '');
    li.innerHTML = '<span>' + (it.kind === 'exit' ? '→ ' : '') + (it.name || it.id)
      + '</span><span class="c">' + (done ? S.rects[it.id].join(',') : '—') + '</span>';
    li.onclick = () => { current = it.id; setMode('rect'); current = it.id; renderList(); };
    ul.appendChild(li);
  });
}

function renderPlanes() {
  const ul = document.getElementById('planes'); ul.innerHTML = '';
  BANDS.forEach((band) => {
    const li = document.createElement('li');
    li.innerHTML = '<span>' + band + '</span><span class="c">plane '
      + S.planes[band] + '</span>';
    li.onclick = () => {
      const v = prompt('Which plane masks an actor standing in ' + band + '?\n'
        + '0 means masked by nothing.', String(S.planes[band]));
      if (v !== null) { S.planes[band] = parseInt(v, 10) || 0; renderPlanes(); }
    };
    ul.appendChild(li);
  });
}

setMode('walk');
boot().catch((e) => { document.getElementById('lede').textContent = 'Could not load: ' + e.message; });

document.getElementById('gen').onclick = () => {
  const far = S.depth[0], near = S.depth[1];
  const out = {
    MERGE_INTO: 'reference/room-' + String(roomNumber()).padStart(2, '0') + '/annotation.json',
    MERGE_NOTE: 'THESE KEYS ONLY. Paste them over the same keys in that file and leave the '
      + 'rest alone -- obstacles, lamps, act states and the notes beside them are authored '
      + 'there and this page does not draw them.',
    room: room.id,
    plate: room.background,
    plateSize: [W, H],
    walkable: S.closed ? S.walk : null,
    scaling: (far && near) ? { far: { y: far[1], height: far[2] },
      near: { y: near[1], height: near[2] } } : null,
    entrance: S.spawn,
    hotspots: {}, exits: {},
    occlusion: {
      clipPlane: S.planes,
      proofPoints: S.proofs.map((p) => ({ at: p.at, expect: p.expect,
        box: p.box || undefined, note: p.note || '' })),
    },
  };
  ITEMS.forEach((it) => { const r = S.rects[it.id]; if (!r) return;
    (it.kind === 'exit' ? out.exits : out.hotspots)[it.id] = r; });
  const missing = ITEMS.filter((i) => !S.rects[i.id]).map((i) => i.id);
  if (missing.length) out.MISSING = missing;
  document.getElementById('out').value = JSON.stringify(out, null, 2);
};
/** The room's number, from its position among the manifest's plated rooms. */
function roomNumber() {
  const m = /room-(\d+)/.exec(room.background || '');
  return m ? Number(m[1]) : 0;
}
document.getElementById('copy').onclick = () => { const t = document.getElementById('out');
  t.select(); document.execCommand('copy'); };
</script></body></html>
