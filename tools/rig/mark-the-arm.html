<div class="panel">
  <h1>Mark the part that should move</h1>
  <p class="hint">Paint over <b>only the arm</b> &mdash; the shoulder down to the hand.
  <span class="swatch"></span>Red is what you have marked.</p>
  <p class="hint">The image sits on top, so paint anywhere and it shows through.</p>
  <label>Brush size: <span id="bs">22</span> px</label>
  <input type="range" id="brush" min="6" max="60" value="22">
  <div style="margin-top:12px">
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="erase">Eraser: off</button>
  </div>
  <div style="margin-top:10px">
    <button class="primary" id="gen">Generate code</button>
    <button id="copy">Copy</button>
  </div>
  <label>Paste this back into the chat:</label>
  <textarea id="out" readonly placeholder="Paint the arm, then press Generate code."></textarea>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const FIGW=678,FIGH=1616,COLS=48,ROWS=114;
let painting=false,erasing=false,brush=22,stack=[];
function snap(){stack.push(x.getImageData(0,0,c.width,c.height));if(stack.length>40)stack.shift();}
function pos(e){const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];}
function dab(px,py){x.globalCompositeOperation=erasing?'destination-out':'source-over';
  x.fillStyle='rgba(255,77,77,0.55)';x.beginPath();x.arc(px,py,brush/2,0,7);x.fill();}
c.addEventListener('pointerdown',e=>{snap();painting=true;const[a,b]=pos(e);dab(a,b);c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(!painting)return;const[a,b]=pos(e);dab(a,b);});
c.addEventListener('pointerup',()=>painting=false);
c.addEventListener('pointerleave',()=>painting=false);
document.getElementById('brush').oninput=e=>{brush=+e.target.value;document.getElementById('bs').textContent=brush;};
document.getElementById('undo').onclick=()=>{if(stack.length)x.putImageData(stack.pop(),0,0);};
document.getElementById('clear').onclick=()=>{snap();x.clearRect(0,0,c.width,c.height);};
document.getElementById('erase').onclick=e=>{erasing=!erasing;e.target.textContent='Eraser: '+(erasing?'ON':'off');};
document.getElementById('gen').onclick=()=>{
  const d=x.getImageData(0,0,c.width,c.height).data,spans=[];
  for(let r=0;r<ROWS;r++){
    const y0=Math.floor(r*c.height/ROWS),y1=Math.floor((r+1)*c.height/ROWS);
    let lo=-1,hi=-1;
    for(let col=0;col<COLS;col++){
      const x0=Math.floor(col*c.width/COLS),x1=Math.floor((col+1)*c.width/COLS);
      let hit=false;
      for(let yy=y0;yy<y1&&!hit;yy+=2)for(let xx=x0;xx<x1;xx+=2)
        if(d[(yy*c.width+xx)*4+3]>40){hit=true;break;}
      if(hit){if(lo<0)lo=col;hi=col;}
    }
    if(lo>=0)spans.push(r+':'+lo+'-'+hi);
  }
  document.getElementById('out').value = spans.length
    ? 'ARMMASK v1 fig='+FIGW+'x'+FIGH+' grid='+COLS+'x'+ROWS+'\n'+spans.join(',')
    : '(nothing painted yet)';
};
document.getElementById('copy').onclick=()=>{const t=document.getElementById('out');
  t.select();document.execCommand('copy');};
</script></body></html>
