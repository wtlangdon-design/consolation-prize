let cur='back',painting=false,erasing=false,brush=22,stack=[];
const col={back:'rgba(255,77,77,0.6)',front:'rgba(77,166,255,0.6)'};

  x.drawImage(layers.front,0,0);x.drawImage(layers.back,0,0);}
function snap(){stack.push([cur,layers[cur].getContext('2d').getImageData(0,0,c.width,c.height)]);

function pos(e){const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function dab(px,py){const g=layers[cur].getContext('2d');
  g.globalCompositeOperation=erasing?'destination-out':'source-over';
  g.fillStyle=col[cur];g.beginPath();g.arc(px,py,brush/2,0,7);g.fill();redraw();}
c.addEventListener('pointerdown',e=>{snap();painting=true;const[a,b]=pos(e);dab(a,b);c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(painting){const[a,b]=pos(e);dab(a,b);}});
c.addEventListener('pointerup',()=>painting=false);
c.addEventListener('pointerleave',()=>painting=false);
document.getElementById('brush').oninput=e=>{brush=+e.target.value;document.getElementById('bs').textContent=brush;};
document.getElementById('undo').onclick=()=>{if(stack.length){const[k,d]=stack.pop();
  layers[k].getContext('2d').putImageData(d,0,0);redraw();}};
document.getElementById('clear').onclick=()=>{snap();layers[cur].getContext('2d').clearRect(0,0,c.width,c.height);redraw();};
document.getElementById('erase').onclick=e=>{erasing=!erasing;e.target.textContent='Eraser: '+(erasing?'ON':'off');e.target.classList.toggle('on',erasing);};
function mode(m){cur=m;
  document.getElementById('mBack').className=m==='back'?'on':'';
  document.getElementById('mFront').className=m==='front'?'on':'';
  document.getElementById('mBack').textContent=m==='back'?'Painting: BACK arm':'Switch to BACK arm';
  document.getElementById('mFront').textContent=m==='front'?'Painting: FRONT arm':'Switch to FRONT arm';}
document.getElementById('mBack').onclick=()=>mode('back');
document.getElementById('mFront').onclick=()=>mode('front');
function encode(cv){const d=cv.getContext('2d').getImageData(0,0,c.width,c.height).data,sp=[];
 for(let r=0;r<ROWS;r++){const y0=Math.floor(r*c.height/ROWS),y1=Math.floor((r+1)*c.height/ROWS);
  let lo=-1,hi=-1;
  for(let q=0;q<COLS;q++){const x0=Math.floor(q*c.width/COLS),x1=Math.floor((q+1)*c.width/COLS);
   let hit=false;
   for(let yy=y0;yy<y1&&!hit;yy+=2)for(let xx=x0;xx<x1;xx+=2)
     if(d[(yy*c.width+xx)*4+3]>40){hit=true;break;}
   if(hit){if(lo<0)lo=q;hi=q;}}
  if(lo>=0)sp.push(r+':'+lo+'-'+hi);}
 return sp.join(',');}
document.getElementById('gen').onclick=()=>{
 const hdr='ARMMASK v1 fig='+FIGW+'x'+FIGH+' grid='+COLS+'x'+ROWS;
 let t='';const b=encode(layers.back),f=encode(layers.front);
 if(b)t+='FAR (back arm)\n'+hdr+'\n'+b+'\n\n';
 if(f)t+='NEAR (front arm)\n'+hdr+'\n'+f+'\n';
 document.getElementById('out').value=t||'(nothing painted yet)';};
document.getElementById('copy').onclick=()=>{const t=document.getElementById('out');t.select();document.execCommand('copy');};
mode('back');
</script></body></html>
