<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Place the map markers</title>
<style>
 body{background:#1b1b22;color:#e8e8ee;font:14px/1.5 system-ui,sans-serif;margin:0;padding:16px;
      display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
 h1{font-size:16px;margin:0 0 8px;font-weight:600}
 #stage{position:relative;line-height:0;background:#2a2a34;padding:8px;border-radius:8px}
 img{display:block;border-radius:4px}
 canvas{position:absolute;top:8px;left:8px;cursor:crosshair}
 .panel{width:320px}
 ul{list-style:none;padding:0;margin:8px 0;max-height:420px;overflow:auto}
 li{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;
    justify-content:space-between;gap:8px}
 li:hover{background:#2f2f3c}
 li.on{background:#4a6ea8}
 li.done span.c{color:#9fd39f}
 span.c{color:#8a8a9e;font:12px ui-monospace,monospace}
 button{background:#3a3a48;color:#e8e8ee;border:1px solid #55556a;border-radius:6px;
        padding:7px 12px;font:inherit;cursor:pointer;margin:0 6px 6px 0}
 button.primary{background:#4a6ea8;border-color:#5b83c4}
 textarea{width:100%;height:150px;background:#12121a;color:#9fd39f;border:1px solid #3a3a48;
          border-radius:6px;padding:8px;font:11px/1.4 ui-monospace,monospace}
 .hint{color:#9a9aae;font-size:13px}
</style></head><body>

<div class="panel">
  <h1>Place the map markers</h1>
  <p class="hint">Pick a place on the left, then click where it belongs on the map.
  It advances to the next one on its own. Coordinates export in the map's own
  1920&times;864 space.</p>
  <ul id="list"></ul>
  <button class="primary" id="gen">Generate</button>
  <button id="copy">Copy</button>
  <button id="reset">Reset all</button>
  <textarea id="out" readonly placeholder="Place them, then press Generate."></textarea>
</div>
<script>
const SCALE = 2;                       // 960 shown, 1920 authored
const locs = [{"id": "loc_main_street", "label": "MAIN STREET", "at": [888, 468]}, {"id": "loc_claims_road", "label": "CLAIMS ROAD", "at": [1440, 708]}, {"id": "loc_undertaker", "label": "UNDERTAKER", "at": [972, 576]}, {"id": "loc_boot_hill", "label": "BOOT HILL", "at": [1716, 444]}, {"id": "loc_registrar", "label": "REGISTRAR", "at": [576, 360]}, {"id": "loc_livery", "label": "THE LIVERY STABLE", "at": [1224, 636]}, {"id": "loc_tent", "label": "OZYMANDIA'S TENT", "at": [888, 264]}, {"id": "loc_church", "label": "THE CHURCH", "at": [348, 264]}, {"id": "loc_back_alley", "label": "THE BACK ALLEY", "at": [1668, 372]}, {"id": "loc_barber", "label": "THE BARBER'S", "at": [420, 540]}, {"id": "loc_boarding_house", "label": "THE BOARDING HOUSE", "at": [204, 636]}, {"id": "loc_photographer", "label": "THE PHOTOGRAPHER'S", "at": [696, 720]}, {"id": "loc_bakehouse", "label": "THE BAKEHOUSE", "at": [1116, 756]}, {"id": "loc_storefront", "label": "THE EMPTY STOREFRONT", "at": [1452, 552]}, {"id": "loc_schoolhouse", "label": "THE SCHOOLHOUSE", "at": [156, 384]}];
const c = document.getElementById('c'), x = c.getContext('2d');
const list = document.getElementById('list');
let cur = 0;
function draw(){
  x.clearRect(0,0,960,432);
  locs.forEach((l,i)=>{
    if(!l.placed) return;
    const px=l.at[0]/SCALE, py=l.at[1]/SCALE;
    x.strokeStyle = i===cur ? '#ffd24a' : '#ff5a5a';
    x.lineWidth = 2;
    x.beginPath(); x.arc(px,py,6,0,6.2832); x.stroke();
    x.fillStyle='#ffe9a8'; x.font='11px system-ui';
    x.fillText(l.label, px+9, py+4);
  });
}
function paint(){
  list.innerHTML='';
  locs.forEach((l,i)=>{
    const li=document.createElement('li');
    li.className=(i===cur?'on ':'')+(l.placed?'done':'');
    li.innerHTML='<span>'+l.label+'</span><span class="c">'+(l.placed?l.at[0]+','+l.at[1]:'—')+'</span>';
    li.onclick=()=>{cur=i;paint();draw();};
    list.appendChild(li);
  });
}
c.addEventListener('click', e=>{
  const b=c.getBoundingClientRect();
  const px=Math.round((e.clientX-b.left)*960/b.width);
  const py=Math.round((e.clientY-b.top)*432/b.height);
  locs[cur].at=[px*SCALE, py*SCALE];
  locs[cur].placed=true;
  const next=locs.findIndex((l,i)=>i>cur && !l.placed);
  cur = next>=0 ? next : cur;
  paint(); draw();
});
document.getElementById('reset').onclick=()=>{locs.forEach(l=>l.placed=false);cur=0;paint();draw();};
document.getElementById('gen').onclick=()=>{
  const done=locs.filter(l=>l.placed);
  document.getElementById('out').value = JSON.stringify(
    done.map(l=>({id:l.id, at:l.at})), null, 1)
    + (done.length<locs.length ? '\n\n// still unplaced: '
        + locs.filter(l=>!l.placed).map(l=>l.id).join(', ') : '');
};
document.getElementById('copy').onclick=()=>{
  const t=document.getElementById('out'); t.select(); document.execCommand('copy');
};
paint(); draw();
</script></body></html>
